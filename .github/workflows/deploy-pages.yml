name: Build and deploy Pars investment website to GitHub Pages

on:
  push:
    branches:
      - arena/4d1d0891-website
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Publish built files for branch-based Pages
        run: |
          rm -rf assets images
          rm -f trust-*.jpg
          cp -R dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the complete build output, including generated copies of public images
          git add -A -- .
          if [ -d images ]; then
            git add -A -- images
          else
            git rm -r --cached --ignore-unmatch -- images
          fi
          if git diff --cached --quiet; then
            echo "The Pages files are already current."
          else
            git commit -m "Publish GitHub Pages build"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
